name: Frontend CI/CD Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t task-frontend:ci .

  deploy:
    name: Deploy frontend to DigitalOcean
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Create release version
        id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend on server
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}" '
            set -e

            cd "${{ secrets.FRONTEND_PATH }}"
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            docker inspect task-frontend --format="{{.Config.Image}}" > /opt/task-frontend-previous-image.txt 2>/dev/null || true

            docker build -t task-frontend:${{ steps.version.outputs.tag }} .
            docker tag task-frontend:${{ steps.version.outputs.tag }} task-frontend:latest

            docker rm -f task-frontend || true
            docker run -d \
              --name task-frontend \
              --restart always \
              --env-file .env \
              -p 3000:3000 \
              task-frontend:${{ steps.version.outputs.tag }}

            echo "${{ steps.version.outputs.tag }}" > /opt/task-management-frontend-version.txt

            CURRENT_IMAGE="task-frontend:${{ steps.version.outputs.tag }}"
            PREVIOUS_IMAGE="$(cat /opt/task-frontend-previous-image.txt 2>/dev/null || true)"

            echo "Current frontend image: $CURRENT_IMAGE"
            echo "Previous frontend image: $PREVIOUS_IMAGE"

            docker images "task-frontend" --format "{{.Repository}}:{{.Tag}}" \
              | grep -v "^task-frontend:latest$" \
              | grep -v "^${CURRENT_IMAGE}$" \
              | grep -v "^${PREVIOUS_IMAGE}$" \
              | xargs -r docker rmi || true

            docker image prune -f
            docker builder prune -f
          '

      - name: Wait for frontend
        run: sleep 15

      - name: Smoke test frontend
        run: curl -f -I "${{ secrets.APP_URL }}"
